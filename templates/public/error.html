{% extends "base.html" %}

{% block title %}Error - IdeaCheck{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="text-center">
            <div class="error-icon mb-4">
                <i class="bi bi-exclamation-triangle-fill text-warning" style="font-size: 4rem;"></i>
            </div>
            
            <h1 class="display-6 fw-bold mb-3">Oops!</h1>
            
            <p class="lead text-muted mb-4">
                {{ message or "Something went wrong. Please try again later." }}
            </p>
            
            <div class="d-flex flex-column flex-sm-row gap-3 justify-content-center">
                <a href="{{ url_for('index') }}" class="btn btn-primary">
                    <i class="bi bi-house"></i> Go Home
                </a>
                
                <button onclick="history.back()" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left"></i> Go Back
                </button>
            </div>
        </div>
    </div>
</div>

<div class="row justify-content-center mt-5">
    <div class="col-lg-8">
        <div class="bg-light rounded-3 p-4 text-center">
            <h5 class="fw-semibold mb-3">Need Help?</h5>
            <p class="text-muted mb-0">
                If you continue to experience issues, please contact support or try refreshing the page.
            </p>
        </div>
    </div>
</div>
{% endblock %}
